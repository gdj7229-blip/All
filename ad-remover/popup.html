<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Ad Remover</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f1f1f1;
      --accent: #ff0033;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 260px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 16px; margin: 0; flex: 1; }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #555; border-radius: 22px; transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform .2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    input:focus-visible + .slider { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Ad Remover</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" aria-label="Enable ad removal">
      <span class="slider"></span>
    </label>
  </header>
  <script src="popup.js"></script>
</body>
</html>
